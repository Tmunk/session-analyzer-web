<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

      const [appPy, analyzerPy, nocturneCss] = await Promise.all([
        fetch("app.py").then((r) => r.text()),
        fetch("analyzer.py").then((r) => r.text()),
        fetch("nocturne.css").then((r) => r.text()),
      ]);

      mount(
        {
          requirements: ["pandas", "chardet"],
          entrypoint: "app.py",
          files: {
            "app.py": appPy,
            "analyzer.py": analyzerPy,
            "nocturne.css": nocturneCss,
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
